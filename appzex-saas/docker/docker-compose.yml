# Local development stack.
#
#   docker compose -f docker/docker-compose.yml up -d            -> MySQL only (default)
#   docker compose -f docker/docker-compose.yml --profile full up -d --build
#                                                                -> MySQL + backend + frontend
#
# Credentials below are for LOCAL DEVELOPMENT ONLY. Never reuse them in production.
name: appzex

services:
  mysql:
    image: mysql:8.4
    container_name: appzex-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-appzex_root_dev}
      MYSQL_DATABASE: appzex
      MYSQL_USER: appzex
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-appzex_dev_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-appzex_root_dev}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    profiles: ["full"]
    build:
      context: ../backend
    container_name: appzex-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://appzex:${MYSQL_PASSWORD:-appzex_dev_password}@mysql:3306/appzex
      JWT_SECRET: ${JWT_SECRET:-local-docker-only-secret-change-me-please-0123456789}
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      UPLOAD_DIR: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      SEED_ON_START: "true"
    ports:
      - "5000:5000"
    volumes:
      - uploads-data:/app/uploads

  frontend:
    profiles: ["full"]
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: appzex-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql-data:
  uploads-data:
